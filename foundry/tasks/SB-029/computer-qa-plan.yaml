login:
  current_product_behavior: No public sign-in or persona-switch route exists in the
    merged baseline.
  issuer: Trusted server-side DemoSessionService.issueForMembership using PrismaDemoSessionRepository.
  credential_transport: Secure HttpOnly SameSite=Lax __Host-stridebrain_demo_session
    cookie; Path=/; no Domain.
  procedure:
  - Operator verifies the preview database and runtime secret belong only to this
    isolated synthetic preview.
  - Operator issues a bounded-lifetime persisted session for the named synthetic fixture
    membership.
  - Operator installs the cookie through a browser context or private local response
    adapter; never via a product role/organization selector.
  - Browser opens the specified locale/project URL and independently verifies persona-specific
    behavior.
  - Before switching persona, clear/revoke the previous session and repeat issuance;
    do not share simultaneous mutation scenarios.
  evidence_safety:
  - Never save tokens, cookies, signing secrets, connection strings, or bootstrap
    secrets in repository artifacts or screenshots.
  - Do not weaken Secure, HttpOnly, same-site, or trusted membership lookup to make
    QA easier.
  - Document the actual verified provisioning command and access URL before PREVIEW_READY.
routes:
  project_key: PRJ-XINYI-026
  locales:
  - en
  - zh-TW
  project: /{locale}/projects/PRJ-XINYI-026
  compare_start: /{locale}/projects/PRJ-XINYI-026/compare
  compare_stored: /{locale}/projects/PRJ-XINYI-026/compare?run={comparisonRunId}&economics={enrichmentRunId}&selected={selectedProjectKeys}
  project_actions: /{locale}/projects/PRJ-XINYI-026/actions
  proposal_review: /{locale}/projects/PRJ-XINYI-026/compare?run={comparisonRunId}&economics={enrichmentRunId}&selected={selectedProjectKeys}&proposal={proposalKey}
  receipt_compare: /{locale}/projects/PRJ-XINYI-026/compare?run={comparisonRunId}&economics={enrichmentRunId}&selected={selectedProjectKeys}&action={actionKey}
  receipt_actions: /{locale}/projects/PRJ-XINYI-026/actions?action={actionKey}
  proposal_selector: proposal; opaque organization-scoped business key, current-authorized
    on every reopen.
  receipt_selector: action; opaque business key, current-authorized on every reopen.
  api:
    prepare:
      method: POST
      path: /api/actions/internal-review/proposals
    reopen_proposal:
      method: GET
      path: /api/actions/internal-review/proposals/{proposalKey}
    confirm:
      method: POST
      path: /api/actions/internal-review
    reopen_receipt:
      method: GET
      path: /api/actions/{actionKey}
  http_checks:
  - POST requires explicit confirmation where applicable, same-origin Origin validation,
    bounded body, and fresh signed cookie context.
  - Private responses use private/no-store caching; credentials never appear in URLs.
  - All GET routes are free of business writes; arbitrary returnTo URLs are rejected
    or ignored.
  - Browser-provided organization, membership, role, capability, authority, or evidence
    arrays never become trusted input.
  preserved_query_keys:
  - run
  - economics
  - selected
  - evidenceMode
  - evidenceClaim
  - evidenceCandidate
  - evidenceFactor
  - evidenceSource
  - evidenceConflict
  - evidenceReturn
  canonical_selected:
  - PRJ-NEIHU-021
  - PRJ-ZHONGSHAN-018
  - PRJ-NANJING-023
  implemented_draft_selectors:
    source: src/modules/internal-review-experience/route-state.ts
    reviewTitle: Approved option key VALIDATE, REVIEW, or CHECK; no free text authority.
    reviewRationale: Approved intent key REVIEW_NEXT, RECORD_QUESTIONS, or VALIDATE_HISTORY.
    reviewAssignee: Opaque authorized candidate key or none; revalidated by the server.
    reviewDue: Empty to clear, or syntactically ISO date; semantic organization-local
      bounds checked by the server.
    reviewEvidence: Value 1 opens the evidence journey while retaining the proposal/draft;
      only one active modal.
    reviewReturn: Bounded focus-return trigger identifier; cancel targets internal-review-entry
      or safe comparison heading.
    reviewError: Allowlisted safe access/expiry/evidence outcome; cannot manufacture
      a successful receipt.
    reviewReplay: Value 1 selects duplicate/replay wording only after an authorized
      action receipt is loaded.
    precedence: An action selector takes precedence over proposal; no GET confirms
      an action.
    cleanup: Cancel, expiry/access loss, and successful receipt clear irrelevant draft
      selectors; success replaces proposal with action.
reviewable_contract_parameters:
  acceptance: Orchestrator accepted the architecture/build contract and entered BUILDING;
    reconcile any later approved refinement before QA execution.
  policy_version: INTERNAL-REVIEW-ACTION-1.0
  proposal_ttl_minutes: 30
  expiry_boundary: expiresAt equal to current server time is expired.
  idempotency:
    key: Server-issued random UUID stored on the proposal; malformed or replacement
      client keys rejected.
    normalized_payload: Proposal, actor, chosen approved title/rationale variants,
      assignee, due date, and explicit confirmation.
    excluded_from_payload_identity: Display locale, request/correlation identifiers,
      and current time.
    replay: Same key and normalized payload returns the same currently authorized
      durable receipt, even after proposal expiry/consumption.
    conflict: Same key with different payload rejects; different keys cannot consume
      a proposal twice.
  dates:
    authority: Organization timezone, Asia/Taipei for Horizon fixture; browser timezone
      is not authoritative.
    default: Preparation local calendar date plus seven days.
    allowed: Clear the date or select a real Gregorian date from confirmation-local
      today through today plus 365 calendar days inclusive.
    cases: Today, today plus 365, yesterday, today plus 366, invalid Gregorian date,
      leap day, cleared date, and midnight boundary.
  assignee:
    default: First eligible Financial Reviewer by stable membership selector, otherwise
      eligible proposer, otherwise unassigned.
    assign_capability: May select a currently eligible authorized candidate or unassigned.
    no_assign_capability: Only stored policy-provided default is accepted; no alternate
      list and no silent reassignment if eligibility changes.
  edit_fields:
    presentation: Labeled finite title and review-intent alternatives, with transparent
      restriction explanation and separate locked verified facts/warnings; no unrestricted-looking
      textarea.
    title_maximum_unicode_code_points: 200
    rationale_intent_maximum_unicode_code_points: 500
    complete_rationale_maximum_unicode_code_points: 8000
    implemented_title_keys:
    - VALIDATE
    - REVIEW
    - CHECK
    implemented_rationale_keys:
    - REVIEW_NEXT
    - RECORD_QUESTIONS
    - VALIDATE_HISTORY
    title_options_en:
    - Validate imported-stone and lighting assumptions for {project} quote v{version}
    - Review imported-stone and lighting assumptions for {project} quote v{version}
    - Check evidence for imported-stone and lighting assumptions in {project} quote
      v{version}
    title_options_zh_tw:
    - 檢核{專案}第{版本}版報價的進口石材與照明假設
    - 審查{專案}第{版本}版報價的進口石材與照明假設
    - 確認{專案}第{版本}版報價之進口石材與照明假設的佐證資料
    rationale_intent_options_en:
    - Review these assumptions against the linked evidence before the next internal
      quotation review.
    - Check the supporting evidence and record questions for internal review.
    - Validate the imported-stone and lighting assumptions using the linked historical
      evidence.
    rationale_intent_options_zh_tw:
    - 下次內部報價審查前，依連結的佐證資料檢核這些假設。
    - 確認佐證資料，並記錄內部審查需要釐清的問題。
    - 依連結的歷史佐證資料，檢核進口石材與照明假設。
    rejection: Arbitrary prose, unsupported option values, markup/controls, invented
      numbers/claims, and client-supplied mandatory fragments reject server-side.
  receipt_reopening:
    freshness: Later material source changes do not erase the already-created business
      fact or block an otherwise authorized receipt merely for staleness.
    authorization: Current project/action and every required evidence source remain
      authorized before sensitive title, assignee, evidence count, or snapshot is
      shown.
    distinction: Newly creating from stale evidence is prohibited; reopening an existing
      receipt reauthorizes access without requiring sources to be unchanged.
  proposal_outcomes:
  - PREPARED
  - PROPOSAL_UNAVAILABLE
  - PROPOSAL_EXPIRED
  - PROPOSAL_STALE
  - PROPOSAL_NOT_AUTHORIZED
  - PROPOSAL_FAILED
  confirmation_outcomes:
  - CREATED
  - IDEMPOTENT_REPLAY
  - ACTION_NOT_AUTHORIZED
  - ASSIGNEE_UNAVAILABLE
  - EVIDENCE_UNAVAILABLE
  - STALE_COMPARISON
  - PROPOSAL_EXPIRED
  - PROPOSAL_ALREADY_CONSUMED
  - IDEMPOTENCY_CONFLICT
  - ACTION_CREATE_FAILED
