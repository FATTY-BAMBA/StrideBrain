canonical_claims:
  title_en: Validate imported-stone and lighting assumptions for Xinyi quote v3
  source: Immutable authorized Stage 5 claims; expected values independently derived
    by reviewed fixture/SQL gates.
  statements:
  - Imported-stone forecast variance versus eligible reconciled-actual history.
  - Lighting quoted-price variance; lighting reconciled-actual evidence is insufficient,
    with two eligible observations and three required where count access is authorized.
  - Accelerated programme is a known difference with no supported quantified premium.
  - Exact comparison/enrichment references and mandatory evidence/uncertainty statements.
  forbidden_claims:
  - The quotation is wrong.
  - A supplier is overcharging.
  - The shorter programme caused a quantified premium.
  - Historical supplier pricing is currently valid without current authoritative evidence.
  - Creating an internal review action approves or issues a quotation or authorizes
    commercial activity.
scenarios:
- id: QA-01
  name: Authorized preparation is preparatory only
  personas:
  - mei
  - finance
  - admin
  steps:
  - Open the assigned Xinyi project and run/reopen an authorized immutable comparison
    and enrichment.
  - Inspect imported-stone evidence, close the panel, and select the explicit internal-review
    action entry.
  - Read title, rationale, required statements, uncertainty, assignee, due date, evidence,
    and run references.
  expected:
  - All text comes from verified structured claims and exact authorized evidence.
  - No Action, successful business AuditEvent, or success receipt exists before explicit
    confirmation.
  - No model/provider service is needed.
  capture: Review screenshot, accessibility tree, route, redacted request result,
    SQL before-count attestation.
- id: QA-02
  name: Bounded edits and mandatory content
  personas:
  - mei
  steps:
  - Select each of the three approved title and review-intent options in both locales;
    inspect clear finite-edit wording and locked verified findings.
  - Through the approved direct-request harness, attempt empty/whitespace values,
    unlisted alternatives, overlength values, markup/control characters, unsupported
    commercial assertions, replaced uncertainty, and contradictory wording.
  - Correct the input and choose an eligible assignee; set, clear, and keyboard-edit
    the due date at all accepted local-date boundaries.
  expected:
  - Exact approved alternatives and content bounds match build-contract.md; invalid
    edits cannot create an action.
  - Mandatory verified statements and uncertainty cannot be removed or contradicted.
  - Errors are localized, associated with fields, and focus reaches the first invalid
    field or linked summary.
  - Draft fields survive recoverable validation failures.
  capture: Each distinct validation state, focused element, labels/error associations,
    no-write SQL attestation.
- id: QA-03
  name: Explicit confirmation and durable receipt
  personas:
  - mei
  - finance
  - admin
  steps:
  - Review the consequence explanation; explicitly create once.
  - Read the durable receipt, follow Project Actions, reopen the receipt, and return
    to comparison.
  expected:
  - Exactly one Action, authorized evidence linkage/snapshot, append-only AuditEvent,
    consumed proposal, and durable receipt/idempotency state commit together.
  - Receipt has safe business key, title, project, assignee/unassigned, due date,
    OPEN status, creator/time, source runs, authorized evidence count, and both return
    links.
  - Receipt heading receives focus and is not replaced by a toast-only result.
  - Project Workspace shows the persisted action.
  - A later source freshness change does not remove a committed receipt when current
    source/project authorization still holds; access loss instead returns a neutral
    denied view.
  capture: Receipt and Project Actions screenshots, URLs, focus, redacted responses,
    independent SQL/audit record evidence.
- id: QA-04
  name: Cancel, Escape, and evidence round trip
  personas:
  - mei
  steps:
  - Open the review sheet using keyboard; inspect an evidence link and return.
  - Cancel with the button and repeat using Escape where supported by the accepted
    sheet behavior.
  expected:
  - Evidence opens through the Stage 7 authorized panel with exact claim/source meaning.
  - Review draft and comparison selection survive evidence navigation where the contract
    permits.
  - Exactly one modal focus trap is active; evidence closes back to the selected review
    field/link and retained draft.
  - Focus returns to the action trigger on cancel; no Action or successful audit is
    created.
  capture: Focus sequence, retained route/draft, screenshot, no-write attestation.
- id: QA-05
  name: Locale and route restoration
  personas:
  - mei
  steps:
  - Switch en to zh-TW and back while comparison selection and evidence context are
    active.
  - Repeat with a prepared/edited review and a created receipt as allowed by accepted
    routing.
  - Refresh, use Back/Forward, open a copied receipt URL, and follow return-to-comparison.
  expected:
  - Run, enrichment, validated selected projects, evidence context, locale, and return
    context survive.
  - Route/locale changes do not silently recalculate results or execute a write.
  - Edits are preserved only as bounded draft state and cleared on receipt/cancel/expiry/access
    loss.
  - Locale controls are reachable within the review/receipt focus boundary and preserve
    approved option identity without changing the confirmation payload.
  capture: Before/after URLs and field state, screenshots in both locales, action-count
    comparison.
- id: QA-06
  name: Retry, double submit, and replay
  personas:
  - mei
  steps:
  - Submit once, rapidly repeat the same confirmation, refresh after success, and
    repeat the identical request through the approved test harness.
  - Repeat using the same server-issued UUID with a different approved title option
    or due date through the test harness.
  - Retry the original payload after switching locale, after proposal expiry, and
    after source freshness changes while access remains authorized.
  expected:
  - Identical retry shows the same durable receipt with localized duplicate/replay
    state.
  - Same key with different payload is rejected; consumed proposal cannot create another
    action.
  - A malformed or different client-generated key cannot replace the stored server-issued
    key; locale alone is not a payload conflict.
  - Independent database evidence proves one Action and one success AuditEvent.
  capture: Replay screenshot, action key equality, redacted response codes, SQL uniqueness/count
    proof.
- id: QA-07
  name: Viewer and unauthenticated denial
  personas:
  - viewer
  steps:
  - Open assigned project/comparison; attempt copied proposal, confirmation, receipt,
    and evidence routes/requests.
  - Repeat with cleared, expired, and revoked sessions provisioned by the operator.
  expected:
  - No sensitive proposal fields, candidate people, action titles/IDs/counts, economics,
    or source metadata leak.
  - Direct proposal/create attempts deny before sensitive reads or writes.
  - Public response does not disclose missing versus inaccessible objects.
  capture: UI and redacted network/HTML evidence; independent sensitive-read and no-write
    assertions.
- id: QA-08
  name: Cross-tenant selectors
  personas:
  - mei
  - northern
  steps:
  - Test other-tenant project, comparison, enrichment, proposal, assignee, action,
    and evidence selectors using operator-provided synthetic references.
  - Compare public behavior with random nonexistent selectors of the same syntax.
  expected:
  - Neutral outcomes contain no hidden names, IDs, values, counts, source titles,
    or exact exclusion reasons.
  - No action is created and no organization or role value supplied by the browser
    becomes authority.
  capture: Sanitized paired responses and screenshots; exact selectors retained only
    in synthetic operator evidence.
- id: QA-09
  name: Assignee authorization
  personas:
  - mei
  - mei_no_assign
  steps:
  - Inspect authorized candidate set; attempt a foreign, inactive, unassigned, or
    evidence-ineligible person through approved negative-test requests.
  - Open as no-assign variant and try to alter the service-provided default.
  - Operator invalidates the chosen assignee after preparation; confirm.
  - With no-assign persona and locked policy default, invalidate that default after
    preparation; confirm without adding a selectable alternate.
  expected:
  - No per-person query waterfall; candidates meet same-organization, active, project,
    assignment, and sensitive-evidence requirements.
  - No-assign user cannot browse/select arbitrary people.
  - Assignee-unavailable state is localized, safe, associated with selection, and
    creates nothing.
  - Locked/default-only assignee failure has a localized linked error region; focus
    falls back to that region when no editable assignee input exists.
  capture: Candidate UI, localized failure, focused field, redacted result, no-write
    proof.
- id: QA-10
  name: Quote, project, and run staleness
  personas:
  - mei
  steps:
  - In separate resettable cases, prepare then have the operator change current quote,
    project state, comparison fingerprints/policy, or enrichment fingerprints/result.
  - Confirm without refreshing; inspect stale response and retained comparison.
  expected:
  - STALE_COMPARISON or accepted REFRESH_REQUIRED mapping; no automatic refresh-and-continue.
  - No Action, partial evidence, successful audit, consumed proposal, or false receipt.
  - Refresh guidance is clear in both locales.
  capture: Each mapped stale UI, original route, redacted result, operator mutation/revert
    attestation.
- id: QA-11
  name: Evidence authority, access, and availability change
  personas:
  - mei
  steps:
  - Prepare then independently change required evidence authority, conflict, freshness,
    supersession, availability, or access in isolated cases.
  - Confirm and attempt reopening affected evidence.
  expected:
  - Safe EVIDENCE_UNAVAILABLE or accepted stale outcome; no business write.
  - Lost-access source details are removed; stale or unsupported evidence never becomes
    a supported conclusion.
  capture: Failure states, cleared sensitive preview, redacted response, no-write
    proof.
- id: QA-12
  name: Permission downgrade during review
  personas:
  - mei
  steps:
  - Prepare, then have operator revoke propose/create capability, project assignment,
    action flag, or required actual/evidence read in separate cases.
  - Confirm and attempt receipt/proposal reopening using the old URL/client state.
  expected:
  - Fresh trusted RuntimeContext takes effect; localized authorization/access-change
    state.
  - Stale client capability hints do not authorize any read/write and sensitive draft
    data is cleared as required.
  capture: Before/after UI, redacted outcome, operator proof of current context, no-write
    proof.
- id: QA-13
  name: Expiry and consumed proposal
  personas:
  - mei
  steps:
  - Operator tests an unconsumed proposal before, exactly at, and after its 30-minute
    expiry; confirm and reopen it.
  - Create a fresh proposal, consume once, then submit with a new key.
  expected:
  - Distinct safe expiry/consumed states and no second action.
  - Retry with the original key/payload returns the same authorized receipt.
  capture: Localized outcomes and action-count proof.
- id: QA-14
  name: Safe service failure and transaction rollback
  personas:
  - mei
  steps:
  - Use accepted isolated fault-injection harness for each transaction step; no debug
    mutation endpoint is added to production code.
  - Attempt confirmation, inspect preserved draft, then retry after the operator removes
    the fault.
  expected:
  - Safe failure with no sensitive internal error or false success.
  - Independent database test proves no partial Action/evidence/AuditEvent/consumption/receipt
    at each injected step.
  - Corrected retry can complete once using accepted idempotency rules.
  capture: Failure screenshot, safe request ID, independent transaction-test report,
    final receipt when recovered.
- id: QA-15
  name: Keyboard, focus, semantics, and zoom
  personas:
  - mei
  - viewer
  steps:
  - Complete preparation, edit, evidence inspection, cancellation, validation, creation,
    and receipt reopening using keyboard only.
  - Inspect accessible names, labels, described-by error connections, dialog semantics,
    focus containment, status announcements, and hidden content.
  - Repeat review/errors/receipt at 200-percent zoom and with reduced-motion preference.
  expected:
  - Logical focus order; no keyboard trap; date entry is keyboard usable; receipt
    heading or first error receives focus.
  - Warnings include text and icons; focus/contrast remain perceivable; content and
    controls remain reachable at zoom.
  - Reduced motion honors preference; automatic updates do not repeatedly steal focus.
  capture: Keyboard action log, focused-element/AX snapshots, zoom screenshots, motion
    preference result.
- id: QA-16
  name: Mobile and Taiwan Traditional Chinese layout
  personas:
  - mei
  steps:
  - Inspect comparison, review, evidence, validation, pending state, and receipt at
    each mobile/tablet width in both locales.
  - Test the longest approved title/review-intent options, keyboard viewport reduction,
    scrolling, and primary controls.
  expected:
  - Review/receipt uses full-height mobile mode with single-column readable content
    and reachable controls.
  - No clipped mandatory warnings, overlapping labels, unintended horizontal scroll,
    or pointer-only date interaction.
  - Natural Taiwan Traditional Chinese parity; no English developer/provider/policy
    plumbing in normal Chinese mode.
  - Report inherited Stage 3/7 localization issues separately; a Stage 8 path still
    fails if the exposed inherited defect blocks its required evidence/review journey.
  capture: Full-page and viewport screenshots, overflow inspection, exact visible
    copy findings.
- id: QA-17
  name: Browser and PostgreSQL performance baseline
  personas:
  - mei
  steps:
  - Record warmed proposal open and confirmation browser timings with network transit
    included, separately from server timings.
  - Link independent PostgreSQL measurements, sample size, query count, environment,
    and exact head.
  expected:
  - Server p95 proposal target at most 500 ms and confirmation target at most 800
    ms excluding network transit.
  - No model request or per-evidence/per-assignee N+1; query counts remain bounded.
  - Report observed browser distribution honestly; do not apply server-only targets
    to network-inclusive measurements.
  capture: Raw sanitized timing samples, p50/p95, sample size, browser/viewport/environment,
    linked server report.
- id: QA-18
  name: Stage 0-7 regression smoke and excluded behavior
  personas:
  - mei
  - viewer
  steps:
  - Recheck workspace, canonical ranked matches, distinct economics labels, lighting
    abstention, programme warning, evidence/factor panels, and locale navigation.
  - Observe the full action journey with model services disabled and inspect available
    controls.
  expected:
  - Prior deterministic comparison/evidence behavior remains intact and no unsupported
    approval/send/complete action appears.
  - No financial mutation, external communication, real data, provider selector, or
    new top-level surface.
  capture: Hero-flow screenshots, model-disabled environment attestation, regression
    report reference.
evidence:
  report: foundry/tasks/SB-029/computer-qa-report.json
  artifact_directory: foundry/tasks/SB-029/evidence/computer-qa/
  per_case:
  - Exact head, build identity, session persona, locale, viewport, timestamp, and
    URL with secrets removed.
  - Steps actually executed and observed result; distinguish NOT_RUN, BLOCKED, PASS,
    and FAIL.
  - Screenshot path/identifier and accessible focus/label evidence where relevant.
  - Redacted request/outcome; never record cookie/header credentials.
  - Linked independent SQL/test evidence for claims invisible to the browser.
  minimum_screenshots:
  - en-desktop-review
  - zh-TW-desktop-review
  - en-mobile-review
  - zh-TW-mobile-review
  - en-validation-focus
  - zh-TW-validation-focus
  - en-desktop-receipt
  - zh-TW-mobile-receipt
  - project-actions-reopen
  - viewer-denied
  - stale-rejected
  - evidence-unavailable
  - assignee-unavailable
  - idempotent-replay
  evidence_limits:
  - Browser screenshots alone do not prove transaction atomicity, absence of sensitive
    server reads, or database uniqueness.
  - Static source review or test success is not a browser run.
  - An unavailable error state or inaccessible test hook is BLOCKED, never assumed
    PASS.
severity:
  P0: Cross-tenant/unauthorized disclosure or write, external/financial mutation,
    real-data use, or secret exposure. Stop all affected activity immediately.
  P1: Duplicate/partial action, incorrect or unsupported claim, missing mandatory
    warning, stale accepted write, broken core creation/receipt, severe keyboard/focus
    block, or critical locale gap. Blocks acceptance.
  P2: Reproducible bounded UX/a11y/layout/performance defect that does not weaken
    business/auth/evidence truth. Record and return for repair; reviewer decides blocking
    status.
  P3: Cosmetic or wording improvement without semantic/accessibility impact. Non-blocking
    only with explicit reviewer rationale.
stop_conditions:
- Preview points to production/live demo or contains real customer data.
- Preview build does not match the approved exact head or current deterministic evidence.
- Any cross-tenant exposure, unauthorized write, secret exposure, or external effect
  occurs.
- Operator cannot safely reset an isolated mutation scenario.
- Source code changes during QA invalidate affected evidence; restart affected checks
  on the new head.
- A policy/contract conflict requires Product Director decision.
- More than three unsuccessful authorized repair cycles are reached.
handoff_prompt_template: '@Computer: Independently QA StrideBrain Stage 8, Issue #29,
  using this plan.

  Open the verified isolated preview URL supplied in readiness.preview_url.

  Verify branch/head/build identity exactly match readiness before testing.

  Use only the operator-provisioned synthetic personas; never select trusted

  organization, role, capability, or membership through browser request fields.

  Test English and Taiwan Traditional Chinese at the specified desktop/mobile

  viewports. Execute QA-01 through QA-18, recording actual outcomes and screenshots.

  Only Create internal review action / 建立內部審查事項 is an authorized business write.

  Check review edits, mandatory uncertainty, evidence, assignees, due dates,

  explicit confirmation, durable receipt, Actions integration, retry, refresh,

  Back/Forward, locale/selection/evidence restoration, Viewer and cross-tenant

  denial, stale/access-change/failure states, and keyboard/focus/mobile behavior.

  Coordinate fixture mutations and SQL observation with the independent test

  operator; do not change source code, policy, deployments, domains, or live data.

  Stop for P0/P1 safety defects. Record NOT_RUN/BLOCKED honestly. Return the

  completed computer-qa-report.json and screenshot paths to the Orchestrator;

  do not approve fixes you authored, merge, or claim release readiness.

  '
resume_conditions:
- Either attach the separate @Computer session to the historical environment ID in
  computer-qa-handoff.md, or launch a new dedicated Cloud QA task using cloud-qa-task.md
  and recreate its isolated synthetic preview with cloud-qa/README.md. A new task's
  localhost identifies its own fresh preview only after readiness is independently proved.
- For the new-task option, verify the current portability HEAD against checkpoint
  2a23d31f46e0b6c7b465b3774ad765c81a3417eb and application source manifest from
  4c13f726bb75f4a31d263eb6e54622224807d019; generate fresh secrets and PostgreSQL 17
  fixtures and record the new production BUILD_ID. Preserve the historical blocked
  report; put new actual results in evidence/cloud-qa/<UTC-run-id>/.
- Recheck branch/source fingerprint/build ID and private production server origin
  before interaction.
- Issue a new trusted fixed-persona session; do not reuse expired credentials or the
  consumed Finance proposal from non-UI smoke.
- Begin a fresh comparison for each persona/scenario; record observed UI and screenshots
  for all18blocked cases.
- Do not publish or change domains to work around local-preview access.
