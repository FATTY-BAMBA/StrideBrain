- Unexpected source/ref divergence
- Any real data or wrong database
- Credential/personal information exposure
- Uncontrolled fixture mutation or failed restoration
- 'Critical/high security or tenant leak: contain and record, do not waive'
- 'Scope-changing repair proposal: stop for explicit decision'
