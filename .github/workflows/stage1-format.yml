name: Stage 1 Formatter

on:
  push:
    branches:
      - build/stage-1-stridegraph-fixture

permissions:
  contents: write

concurrency:
  group: stridebrain-stage1-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format Stage 1 source files
        run: |
          npx prettier --write \
            eslint.config.mjs \
            src/modules/finance/fixed-decimal.ts \
            tests/finance/fixed-decimal.test.ts \
            tests/fixtures/horizon-atelier-manifest.test.ts \
            tests/repositories/prisma-project-repository.test.ts

      - name: Commit formatting changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            eslint.config.mjs \
            src/modules/finance/fixed-decimal.ts \
            tests/finance/fixed-decimal.test.ts \
            tests/fixtures/horizon-atelier-manifest.test.ts \
            tests/repositories/prisma-project-repository.test.ts
          git commit -m "style: format Stage 1 sources"
          git push
