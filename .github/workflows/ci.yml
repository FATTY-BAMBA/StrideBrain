name: StrideBrain CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stridebrain-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_STRIDEBRAIN_ENV: preview
  STRIDEBRAIN_DATA_MODE: DEMO_SYNTHETIC
  STRIDEBRAIN_APP_ORIGIN: http://localhost:3000
  DATABASE_URL: postgresql://stridebrain:stridebrain@localhost:5432/stridebrain?schema=public

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stridebrain
          POSTGRES_PASSWORD: stridebrain
          POSTGRES_DB: stridebrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stridebrain -d stridebrain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      # Exercise the real Prisma deployment commands against the service's base database.
      - name: Apply committed migrations
        run: npm run db:migrate

      - name: Seed Horizon Atelier fixture
        run: npm run db:seed

      - name: Verify tenant, authority, and fixture invariants
        run: npm run db:verify

      - name: Verify repeatable synthetic fixture reset
        run: npm run db:seed && npm run db:verify

      # Vitest separately applies SQL to its own template and clones isolated workers,
      # exactly as on a developer machine; that setup does not exercise the Prisma CLI.
      - name: Run complete check with isolated databases
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
