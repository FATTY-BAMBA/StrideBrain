name: Stage 6 formatter

on:
  push:
    branches:
      - build/stage-6-structured-comparison-experience
    paths:
      - .github/workflows/stage6-format.yml

permissions:
  contents: write

jobs:
  format-stage6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Stage 6 branch
        uses: actions/checkout@v6
        with:
          ref: build/stage-6-structured-comparison-experience

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply accessibility and CSS cleanup
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("src/components/comparisons/comparison-loading.module.css"); p.write_text(p.read_text().replace("  aria-busy: true;\n", ""))'
          if ! grep -Fq ':global(.sr-only)' src/components/comparisons/comparison-experience.module.css; then
            printf '\n\n:global(.sr-only) {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n' >> src/components/comparisons/comparison-experience.module.css
          fi

      - name: Format repository files
        run: npm run format

      - name: Remove one-time workflow
        run: rm .github/workflows/stage6-format.yml

      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/stage6-format.yml
          git commit -m "style(stage6): format comparison experience"
          git push origin HEAD:build/stage-6-structured-comparison-experience
