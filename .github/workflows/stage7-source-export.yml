name: Stage 7 source export

on:
  push:
    branches:
      - build/stage-7-evidence-panel
    paths:
      - .github/workflows/stage7-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Stage 7 branch
        uses: actions/checkout@v6
        with:
          ref: build/stage-7-evidence-panel

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install exact Prisma toolchain
        run: npm install --prefix /tmp/stridebrain-prisma-tools --no-save --no-audit --no-fund prisma@7.10.1 @prisma/client@7.10.1

      - name: Create validation archives
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.generated \
            -czf /tmp/stridebrain-stage7-source.tar.gz .
          tar -czf /tmp/stridebrain-stage7-node-modules.tar.gz node_modules
          tar -C /tmp/stridebrain-prisma-tools -czf /tmp/stridebrain-stage7-prisma-tools.tar.gz .

      - name: Upload clean source archive
        uses: actions/upload-artifact@v4
        with:
          name: stridebrain-stage7-source
          path: /tmp/stridebrain-stage7-source.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload exact application dependencies
        uses: actions/upload-artifact@v4
        with:
          name: stridebrain-stage7-node-modules
          path: /tmp/stridebrain-stage7-node-modules.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload exact Prisma toolchain
        uses: actions/upload-artifact@v4
        with:
          name: stridebrain-stage7-prisma-tools
          path: /tmp/stridebrain-stage7-prisma-tools.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
