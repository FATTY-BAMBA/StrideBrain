name: Stage 1 Safe Fixture Rewrite

on:
  push:
    branches:
      - build/stage-1-stridegraph-fixture

permissions:
  contents: write

concurrency:
  group: stridebrain-stage1-safe-seed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Restrict fixture cleanup to fixture organizations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("prisma/fixtures/horizon-atelier.sql")
          source = path.read_text()
          previous = 'TRUNCATE TABLE "Organization" CASCADE;'
          replacement = '''DELETE FROM "Organization"
          WHERE "id" IN ('org_horizon', 'org_northern')
             OR "businessKey" IN ('HORIZON_ATELIER', 'NORTHERN_STUDIO');'''
          if previous not in source:
              raise SystemExit("Expected fixture cleanup statement was not found")
          path.write_text(source.replace(previous, replacement, 1))
          PY

      - name: Commit fixture safety change
        run: |
          if [ -z "$(git status --porcelain -- prisma/fixtures/horizon-atelier.sql)" ]; then
            echo "Fixture cleanup is already scoped."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/fixtures/horizon-atelier.sql
          git commit -m "fixture: scope reseed cleanup to fixture organizations"
          git push
