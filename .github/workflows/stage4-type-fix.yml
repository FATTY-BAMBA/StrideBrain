name: Stage 4 public quote-key test fix

on:
  push:
    branches:
      - build/stage-4-comparable-project-core

permissions:
  contents: write

jobs:
  type-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/stage-4-comparable-project-core
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Rename the public test field and remove diagnostics
        shell: python
        run: |
          from pathlib import Path

          test_path = Path("tests/comparisons/similarity-policy.test.ts")
          text = test_path.read_text()
          old = '  activeQuoteVersionId: "qv_xinyi_026_v3",'
          new = '  activeQuoteVersionKey: "Q-XINYI-026-v3",'
          if old not in text:
              raise SystemExit("Expected stale active quote version field was not found")
          test_path.write_text(text.replace(old, new, 1))

          diagnostic = Path("docs/development/STAGE_4_TYPECHECK_ERRORS.txt")
          if diagnostic.exists():
              diagnostic.unlink()

      - name: Apply and verify repository formatting and typecheck
        run: |
          npm run format
          npm run format:check
          npm run typecheck
          git diff --check

      - name: Remove one-time workflow
        run: rm .github/workflows/stage4-type-fix.yml

      - name: Commit exact Stage 4 type repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(stage4): align public quote-key test contract"
          git push origin HEAD:build/stage-4-comparable-project-core
