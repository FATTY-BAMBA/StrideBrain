name: Stage 3 strict warning literal fix

on:
  push:
    branches:
      - build/stage-3-project-workspace-read-model

permissions:
  contents: write

jobs:
  fix-warning-literals:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Stage 3 branch
        uses: actions/checkout@v6
        with:
          ref: build/stage-3-project-workspace-read-model
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Preserve strict warning-code literals
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/modules/projects/application/get-project-workspace.ts")
          text = path.read_text()

          conflict_old = '    warningCodes: Object.freeze(["EVIDENCE_CONFLICT"]),'
          conflict_new = '    warningCodes: Object.freeze(["EVIDENCE_CONFLICT"] as const),'
          if conflict_old not in text:
              raise SystemExit("Expected conflict warning expression was not found")
          text = text.replace(conflict_old, conflict_new, 1)

          stale_old = '    warningCodes: Object.freeze(stale ? ["EVIDENCE_STALE"] : []),'
          stale_new = '''    warningCodes: Object.freeze<ProjectWorkspaceWarningCode[]>(
              stale ? ["EVIDENCE_STALE"] : [],
            ),'''
          if stale_old not in text:
              raise SystemExit("Expected stale warning expression was not found")
          text = text.replace(stale_old, stale_new, 1)

          path.write_text(text)

      - name: Apply and verify repository formatting
        run: |
          npm run format
          npm run format:check
          git diff --check

      - name: Remove one-time workflow
        run: rm .github/workflows/stage3-type-literal-fix.yml

      - name: Commit strict literal repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(stage3): preserve strict warning-code literals"
          git push origin HEAD:build/stage-3-project-workspace-read-model
