name: Stage 2 Workflow Cleanup

on:
  push:
    branches:
      - build/stage-2-runtime-authorization

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Remove temporary Stage 2 workflows
        run: |
          git rm -f .github/workflows/stage2-format.yml .github/workflows/stage2-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove temporary Stage 2 workflows"
          git push
