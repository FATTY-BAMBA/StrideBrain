name: Stage 1 Final Formatter

on:
  push:
    branches:
      - build/stage-1-stridegraph-fixture

permissions:
  contents: write

concurrency:
  group: stridebrain-stage1-final-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format repository test
        run: npx prettier --write tests/repositories/prisma-project-repository.test.ts

      - name: Commit formatting changes
        run: |
          if [ -z "$(git status --porcelain -- tests/repositories/prisma-project-repository.test.ts)" ]; then
            echo "File is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/repositories/prisma-project-repository.test.ts
          git commit -m "style: apply final Stage 1 formatting"
          git push
