name: Stage 4 final formatting

on:
  push:
    branches:
      - build/stage-4-comparable-project-core

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/stage-4-comparable-project-core
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Apply and verify repository formatting
        run: |
          npm run format
          npm run format:check
          git diff --check

      - name: Remove one-time workflow
        run: rm .github/workflows/stage4-final-format.yml

      - name: Commit formatted Stage 4 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(stage4): apply final repository formatting"
          git push origin HEAD:build/stage-4-comparable-project-core
