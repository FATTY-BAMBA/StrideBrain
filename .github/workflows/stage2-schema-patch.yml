name: Stage 2 Schema Patcher

on:
  push:
    branches:
      - build/stage-2-runtime-authorization

permissions:
  contents: write

concurrency:
  group: stridebrain-stage2-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Add Stage 2 Prisma models and relations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('prisma/schema.prisma')
          source = path.read_text()

          role_block = '''enum MembershipRole {
            ORGANIZATION_ADMIN
            PROJECT_MANAGER_ESTIMATOR
            FINANCIAL_REVIEWER
            VIEWER
          }
          '''
          effect_block = role_block + '''
          enum CapabilityEffect {
            ALLOW
            DENY
          }
          '''
          if 'enum CapabilityEffect' not in source:
              if role_block not in source:
                  raise SystemExit('MembershipRole block not found')
              source = source.replace(role_block, effect_block, 1)

          org_anchor = '''  actions              Action[]
            auditEvents          AuditEvent[]
          }'''
          org_replacement = '''  actions              Action[]
            auditEvents          AuditEvent[]
            capabilityGrants     MembershipCapabilityGrant[]
            demoSessions         DemoSession[]
          }'''
          if 'capabilityGrants     MembershipCapabilityGrant[]' not in source:
              if org_anchor not in source:
                  raise SystemExit('Organization relation anchor not found')
              source = source.replace(org_anchor, org_replacement, 1)

          membership_anchor = '''  assignments  ProjectAssignment[]
            auditEvents  AuditEvent[]       @relation("AuditActorMembership")

            @@unique([organizationId, personId])'''
          membership_replacement = '''  assignments      ProjectAssignment[]
            auditEvents      AuditEvent[]                @relation("AuditActorMembership")
            capabilityGrants MembershipCapabilityGrant[]
            demoSessions     DemoSession[]

            @@unique([organizationId, personId])'''
          if 'capabilityGrants MembershipCapabilityGrant[]' not in source:
              if membership_anchor not in source:
                  raise SystemExit('Membership relation anchor not found')
              source = source.replace(membership_anchor, membership_replacement, 1)

          project_assignment_anchor = '''model ProjectAssignment {'''
          models = '''model MembershipCapabilityGrant {
            id             String           @id
            organizationId String
            membershipId   String
            capability     String
            effect         CapabilityEffect
            createdAt      DateTime         @default(now())
            updatedAt      DateTime         @updatedAt

            organization Organization @relation(fields: [organizationId], references: [id], onDelete: Cascade)
            membership   Membership   @relation(fields: [membershipId], references: [id], onDelete: Cascade)

            @@unique([organizationId, membershipId, capability])
            @@unique([id, organizationId])
            @@index([organizationId, membershipId, effect])
          }

          model DemoSession {
            id              String    @id
            organizationId  String
            membershipId    String
            tokenHash        String    @unique
            preferredLocale  String    @default("zh-TW")
            issuedAt         DateTime  @default(now())
            expiresAt        DateTime
            revokedAt        DateTime?
            lastSeenAt       DateTime?

            organization Organization @relation(fields: [organizationId], references: [id], onDelete: Cascade)
            membership   Membership   @relation(fields: [membershipId], references: [id], onDelete: Cascade)

            @@unique([id, organizationId])
            @@index([organizationId, membershipId, expiresAt])
            @@index([expiresAt, revokedAt])
          }

          model ProjectAssignment {'''
          if 'model MembershipCapabilityGrant' not in source:
              if project_assignment_anchor not in source:
                  raise SystemExit('ProjectAssignment anchor not found')
              source = source.replace(project_assignment_anchor, models, 1)

          path.write_text(source)
          PY

      - name: Commit schema changes
        run: |
          if [ -z "$(git status --porcelain -- prisma/schema.prisma)" ]; then
            echo "Schema is already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git commit -m "auth: add Stage 2 Prisma session and grant models"
          git push
