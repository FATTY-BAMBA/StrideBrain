name: Stage 5 economics domain bootstrap

on:
  push:
    branches:
      - build/stage-5-historical-economics
    paths:
      - .github/workflows/stage5-domain-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_STRIDEBRAIN_ENV: preview
  STRIDEBRAIN_DATA_MODE: DEMO_SYNTHETIC
  STRIDEBRAIN_APP_ORIGIN: http://localhost:3000

jobs:
  install-domain-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Stage 5 branch
        uses: actions/checkout@v6
        with:
          ref: build/stage-5-historical-economics

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore reviewed domain slice
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src/modules/economics tests/economics
          tar -xzf .github/stage5-domain.tar.gz

      - name: Apply repository formatting
        run: npx prettier --write 'src/modules/economics/**/*.ts' 'tests/economics/**/*.ts'

      - name: Verify domain slice
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Remove bootstrap artifacts
        run: rm .github/workflows/stage5-domain-bootstrap.yml .github/stage5-domain.tar.gz

      - name: Commit verified Stage 5 domain core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/economics tests/economics .github/workflows/stage5-domain-bootstrap.yml .github/stage5-domain.tar.gz
          git commit -m "feat(stage5): add authority-aware economics domain core"
          git push origin HEAD:build/stage-5-historical-economics
