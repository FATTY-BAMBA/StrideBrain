name: Bootstrap package lock

on:
  push:
    branches:
      - build/stage-0-scaffold
    paths:
      - package.json
      - .github/workflows/bootstrap-package-lock.yml

permissions:
  contents: write

jobs:
  scaffold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out scaffold branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies and generate package lock
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Format Stage 0 application files
        run: >-
          npx prettier --write
          package.json
          tsconfig.json
          next.config.ts
          next-env.d.ts
          eslint.config.mjs
          prettier.config.mjs
          vitest.config.ts
          '.env.example'
          '.gitignore'
          '.prettierignore'
          'src/**/*.{ts,tsx,css}'
          'tests/**/*.ts'

      - name: Commit reproducible scaffold artifacts
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Scaffold artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json tsconfig.json next.config.ts next-env.d.ts \
            eslint.config.mjs prettier.config.mjs vitest.config.ts .env.example .gitignore \
            .prettierignore src tests
          git commit -m "build: lock and format Stage 0 scaffold"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
