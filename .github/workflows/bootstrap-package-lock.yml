name: Bootstrap package lock

on:
  push:
    branches:
      - build/stage-0-scaffold
    paths:
      - package.json
      - .github/workflows/bootstrap-package-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out scaffold branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- package-lock.json)" ]]; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: generate reproducible package lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
