name: Bootstrap package lock

on:
  push:
    branches:
      - build/stage-0-scaffold
    paths:
      - package.json
      - .github/workflows/bootstrap-package-lock.yml

permissions:
  contents: write

jobs:
  scaffold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out scaffold branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies and generate package lock
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Format package manifest
        run: npx prettier --write package.json

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- package.json package-lock.json)" ]]; then
            echo "Dependency artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: refresh Stage 0 dependency lock"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
