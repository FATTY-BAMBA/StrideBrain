name: Stage 6 final formatter

on:
  push:
    branches:
      - build/stage-6-structured-comparison-experience
    paths:
      - .github/workflows/stage6-final-format.yml

permissions:
  contents: write

jobs:
  format-final-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Stage 6 branch
        uses: actions/checkout@v6
        with:
          ref: build/stage-6-structured-comparison-experience

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply exact Prettier output
        run: npx prettier --write src/modules/localization/catalog.ts tests/navigation/language-switcher-state.test.ts

      - name: Verify formatting
        run: npm run format:check

      - name: Remove one-time workflow
        run: rm .github/workflows/stage6-final-format.yml

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/localization/catalog.ts tests/navigation/language-switcher-state.test.ts .github/workflows/stage6-final-format.yml
          git commit -m "style(stage6): format final comparison files"
          git push origin HEAD:build/stage-6-structured-comparison-experience
