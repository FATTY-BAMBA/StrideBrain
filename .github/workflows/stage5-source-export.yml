name: Stage 5 source snapshot

on:
  push:
    branches:
      - build/stage-5-historical-economics
    paths:
      - .github/workflows/stage5-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Stage 5 branch
        uses: actions/checkout@v6
        with:
          ref: build/stage-5-historical-economics

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Install exact Prisma tools
        run: npm install --prefix /tmp/stridebrain-prisma-tools --no-save --no-audit --no-fund prisma@7.10.1 @prisma/client@7.10.1

      - name: Create source, dependency, and Prisma archives
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.generated \
            -czf /tmp/stridebrain-stage5-source.tar.gz .
          tar -czf /tmp/stridebrain-stage5-node-modules.tar.gz node_modules
          tar -C /tmp/stridebrain-prisma-tools -czf /tmp/stridebrain-stage5-prisma-tools.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: stridebrain-stage5-source
          path: /tmp/stridebrain-stage5-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload dependency archive
        uses: actions/upload-artifact@v4
        with:
          name: stridebrain-stage5-node-modules
          path: /tmp/stridebrain-stage5-node-modules.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload Prisma toolchain
        uses: actions/upload-artifact@v4
        with:
          name: stridebrain-stage5-prisma-tools
          path: /tmp/stridebrain-stage5-prisma-tools.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
