name: Stage 4 TypeScript diagnostic capture

on:
  push:
    branches:
      - build/stage-4-comparable-project-core

permissions:
  contents: write

jobs:
  capture-typecheck:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/stage-4-comparable-project-core
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Capture exact compiler output
        shell: bash
        run: |
          set +e
          npm run typecheck > docs/development/STAGE_4_TYPECHECK_ERRORS.txt 2>&1
          code=$?
          printf '\nEXIT_CODE=%s\n' "$code" >> docs/development/STAGE_4_TYPECHECK_ERRORS.txt
          exit 0

      - name: Remove one-time workflow
        run: rm .github/workflows/stage4-typecheck-diagnostic.yml

      - name: Commit compiler diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(stage4): capture exact TypeScript diagnostics"
          git push origin HEAD:build/stage-4-comparable-project-core
