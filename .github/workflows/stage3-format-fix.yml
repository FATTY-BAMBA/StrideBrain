name: Stage 3 format and read-boundary fix

on:
  push:
    branches:
      - build/stage-3-project-workspace-read-model

permissions:
  contents: write

jobs:
  format-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Stage 3 branch
        uses: actions/checkout@v6
        with:
          ref: build/stage-3-project-workspace-read-model
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Tighten Viewer read boundary
        shell: python
        run: |
          from pathlib import Path

          use_case = Path("src/modules/projects/application/get-project-workspace.ts")
          text = use_case.read_text()
          text = text.replace("  type AuthorityState,\n", "")
          old = "      this.workspace.listOpenActions(context.organizationId, base.id),"
          new = """      context.role === \"VIEWER\"
                ? Promise.resolve([])
                : this.workspace.listOpenActions(context.organizationId, base.id),"""
          if old not in text:
              raise SystemExit("Expected action read call was not found")
          use_case.write_text(text.replace(old, new))

          test_file = Path("tests/projects/get-project-workspace.test.ts")
          tests = test_file.read_text()
          anchor = "    expect(repositories.listSupplierOffers).not.toHaveBeenCalled();\n"
          addition = anchor + "    expect(repositories.listOpenActions).not.toHaveBeenCalled();\n"
          if anchor not in tests:
              raise SystemExit("Expected Viewer test anchor was not found")
          test_file.write_text(tests.replace(anchor, addition, 1))

      - name: Apply repository formatting
        run: npm run format

      - name: Remove one-time workflow
        run: rm .github/workflows/stage3-format-fix.yml

      - name: Verify resulting patch
        run: |
          npm run format:check
          git diff --check

      - name: Commit formatted Stage 3 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(stage3): format read model and tighten Viewer reads"
          git push origin HEAD:build/stage-3-project-workspace-read-model
