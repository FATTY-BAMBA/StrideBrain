name: Stage 4 contract and formatting normalization

on:
  push:
    branches:
      - build/stage-4-comparable-project-core

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/stage-4-comparable-project-core
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Normalize Stage 4 public contracts
        shell: python
        run: |
          from pathlib import Path

          contracts = Path("src/modules/comparisons/domain/contracts.ts")
          text = contracts.read_text()
          if '  | "COMPLETION_DATE_INVALID"' not in text:
              anchor = '  | "METADATA_AUTHORITY_INSUFFICIENT"\n'
              if anchor not in text:
                  raise SystemExit("Eligibility reason insertion point not found")
              text = text.replace(
                  anchor,
                  anchor + '  | "COMPLETION_DATE_INVALID"\n',
                  1,
              )

          marker = "export type PersistCompleteComparisonInput"
          if marker not in text:
              raise SystemExit("Persistence contract marker not found")
          public_contracts, persistence_contracts = text.split(marker, 1)
          public_contracts = public_contracts.replace(
              "activeQuoteVersionId?: string | undefined;",
              "activeQuoteVersionKey?: string | undefined;",
          )
          if "activeQuoteVersionId?: string | undefined;" in public_contracts:
              raise SystemExit("Public quote-version ID remained after normalization")
          text = public_contracts + marker + persistence_contracts
          contracts.write_text(text)

          replacements = {
              "src/modules/comparisons/application/active-project-context-service.ts": [
                  (
                      "      activeQuoteVersionId: record.activeQuoteVersionKey,",
                      "      activeQuoteVersionKey: record.activeQuoteVersionKey,",
                  )
              ],
              "src/modules/comparisons/application/run-comparable-project-analysis.ts": [
                  (
                      "          activeQuoteVersionId: resolved.context.activeQuoteVersionId,",
                      "          activeQuoteVersionKey: resolved.context.activeQuoteVersionKey,",
                  )
              ],
              "tests/comparisons/run-comparable-project-analysis.test.ts": [
                  (
                      "outcome.result.activeContext.activeQuoteVersionId",
                      "outcome.result.activeContext.activeQuoteVersionKey",
                  )
              ],
          }
          for file_name, pairs in replacements.items():
              path = Path(file_name)
              value = path.read_text()
              for old, new in pairs:
                  if old in value:
                      value = value.replace(old, new, 1)
              path.write_text(value)

          persistence_test = Path("tests/repositories/prisma-comparison-run-repository.test.ts")
          value = persistence_test.read_text()
          public_result = '    activeQuoteVersionId: "Q-XINYI-026-v3",'
          if public_result in value:
              value = value.replace(
                  public_result,
                  '    activeQuoteVersionKey: "Q-XINYI-026-v3",',
                  1,
              )
          persistence_test.write_text(value)

      - name: Format and verify
        run: |
          npm run format
          npm run format:check
          git diff --check

      - name: Remove one-time workflow
        run: rm .github/workflows/stage4-contract-format.yml

      - name: Commit normalized Stage 4 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(stage4): normalize public quote keys and format core"
          git push origin HEAD:build/stage-4-comparable-project-core
