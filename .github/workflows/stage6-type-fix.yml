name: Stage 6 type fixes

on:
  push:
    branches:
      - build/stage-6-structured-comparison-experience
    paths:
      - .github/workflows/stage6-type-fix.yml

permissions:
  contents: write

jobs:
  fix-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Stage 6 branch
        uses: actions/checkout@v6
        with:
          ref: build/stage-6-structured-comparison-experience

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://stridebrain:stridebrain@localhost:5432/stridebrain?schema=public
        run: npm run db:generate

      - name: Apply exact TypeScript fixes
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("src/components/comparisons/comparison-experience-client.tsx"); s=p.read_text(); s=s.replace("return styles.bandStrong;", "return styles.bandStrong ?? \"\";").replace("return styles.bandRelevant;", "return styles.bandRelevant ?? \"\";").replace("return styles.bandPartial;", "return styles.bandPartial ?? \"\";").replace("return styles.bandBroader;", "return styles.bandBroader ?? \"\";"); p.write_text(s)'
          python -c 'from pathlib import Path; p=Path("src/lib/server/prisma.ts"); s=p.read_text().replace("  globalPrisma.__stridebrainPrisma = undefined;", "  delete globalPrisma.__stridebrainPrisma;"); p.write_text(s)'
          python -c 'from pathlib import Path; p=Path("src/modules/comparison-experience/route-state.ts"); s=p.read_text().replace("  return Array.isArray(value) ? value[0] : value;", "  return typeof value === \"string\" ? value : value?.[0];"); p.write_text(s)'
          python -c 'from pathlib import Path; p=Path("src/modules/comparison-experience/build-comparison-experience.ts"); s=p.read_text().replace("  SimilarityFactorKey,\n", ""); p.write_text(s)'
          python -c 'from pathlib import Path; p=Path("tests/comparison-experience/build-comparison-experience.test.ts"); s=p.read_text(); s=s.replace("  inputs: typeof quoteInputs,", "  inputs: readonly Readonly<{\n    observationId: string;\n    projectKey: string;\n    normalizedValue: string;\n    unit: string;\n    evidenceReferenceIds: readonly string[];\n  }>[],"); s=s.replace("actualInputs as typeof quoteInputs", "actualInputs"); p.write_text(s)'

      - name: Format and typecheck
        run: |
          npm run format
          npm run typecheck

      - name: Remove one-time workflow
        run: rm .github/workflows/stage6-type-fix.yml

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/stage6-type-fix.yml
          git commit -m "fix(stage6): resolve strict TypeScript boundaries"
          git push origin HEAD:build/stage-6-structured-comparison-experience
