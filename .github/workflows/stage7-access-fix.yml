name: Apply Stage 7 comparison-library access fix

on:
  push:
    branches:
      - build/stage-7-evidence-panel
    paths:
      - .github/workflows/stage7-access-fix.yml
      - .github/stage7-access-fix.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Stage 7 branch
        uses: actions/checkout@v6
        with:
          ref: build/stage-7-evidence-panel
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify exact fix
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/stage7-access-fix.b64 | gunzip > /tmp/stage7-access-fix.patch
          echo "b9500080840c72ae159e1992f0d01a326a354f8aff3617bd2445c4d95360b7b9  /tmp/stage7-access-fix.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/stage7-access-fix.patch

      - name: Apply fix and remove transport artifacts
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/stage7-access-fix.patch
          git rm .github/stage7-access-fix.b64 .github/workflows/stage7-access-fix.yml

      - name: Commit exact fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git commit -m "fix(stage7): align evidence access with comparison library"
          git push origin HEAD:build/stage-7-evidence-panel
