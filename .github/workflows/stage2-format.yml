name: Stage 2 Formatter

on:
  push:
    branches:
      - build/stage-2-runtime-authorization

permissions:
  contents: write

concurrency:
  group: stridebrain-stage2-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply repository formatter
        run: npm run format

      - name: Commit formatting changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json tsconfig.json next.config.ts next-env.d.ts eslint.config.mjs prettier.config.mjs vitest.config.ts prisma.config.ts .github/workflows/ci.yml src tests
          git commit -m "style: format Stage 2 sources"
          git push
